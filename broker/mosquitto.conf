# Only one way in: MQTT over TLS on port 8883.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# Every client must log in, and the ACL limits what each one may do.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
# A client's ID is always its username, so nobody can kick another client
# off by connecting with the same client ID.
use_username_as_clientid true
# Sensor messages are tiny; refuse anything big.
max_packet_size 2048

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
