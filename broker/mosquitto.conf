# Only one way in: MQTT over TLS on port 8883.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# Every client must log in, and the ACL limits what each one may do.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
