name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "ingest[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests (ingest)
        run: cd ingest && pytest -m "not integration" -v
      - name: Unit tests (simulator)
        run: cd simulator && pytest -v
      - name: Unit tests (firmware logic)
        run: if [ -d firmware/tests ]; then cd firmware && pytest -v; else echo "no firmware tests yet"; fi

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "ingest[dev]"
      - run: cd ingest && pytest -m integration -v

  e2e:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose
      CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "ingest[dev]"
      - name: Set up passwords, certificates and a simulated device
        run: |
          scripts/setup.sh
          scripts/add_device.sh pico-sim | awk '{print $3}' > /tmp/sim-password
      - run: docker compose up -d --build
      - name: Wait for the ingest service to subscribe
        run: timeout 90 bash -c 'until docker compose logs ingest | grep -q subscribing; do sleep 1; done'
      - name: Publish 6 readings with the simulator
        run: timeout 60 python simulator/simulate.py --device pico-sim --password "$(cat /tmp/sim-password)" --count 6 --interval 1
      - run: simulator/e2e_check.sh 6
      - name: Anonymous clients are refused
        run: |
          if docker compose exec -T mosquitto mosquitto_pub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt -t sensors/x/readings -m x; then
            echo "anonymous publish was accepted" >&2; exit 1
          fi
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color mosquitto ingest postgres | tail -80
          ls -la certs broker
      - if: always()
        run: docker compose down -v
