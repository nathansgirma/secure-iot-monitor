apiVersion: 1
datasources:
  - name: PostgreSQL
    uid: iot-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana
    isDefault: true
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      database: iot
      sslmode: disable
      postgresVersion: 1600
