[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["paho-mqtt>=2,<3", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["ingest"]

[tool.pytest.ini_options]
markers = ["integration: needs a PostgreSQL database (DATABASE_URL)"]
